# ============================================================
# 显示器
# 文档：https://wiki.hyprland.org/Configuring/Monitors/
# 查看当前输出：hyprctl monitors
# ============================================================

# --- 当前策略（通用起步）---
# 未单独指名的显示器统一：首选模式、放在 0x0、缩放 1.25。
# 优点：换机器 / 只插一块屏时少改配置。
# 注意：多块屏同时接入时都会抢 0x0，可能重叠；插外接后务必按下方「待细化」补全。
monitor = , preferred, 0x0, 1.25

# ------------------------------------------------------------
# 待细化（第一版不启用，插外接或多屏时再改）
# ------------------------------------------------------------
# 建议步骤：
# 1. 运行 hyprctl monitors，记下 name / 分辨率 / 刷新率
# 2. 为内屏、外接分别写 monitor 行（位置不要都设 0x0）
# 3. 通配行可保留作「未列出输出」的兜底，或删掉以免冲突
#
# 示例（请按实机修改，勿直接照抄坐标）：
# monitor = eDP-1, preferred, 0x0, 1.25
# monitor = HDMI-A-1, preferred, auto, 1        # 放在已有屏右侧（auto）
# monitor = DP-1, 1920x1080@60, 1920x0, 1       # 显式分辨率与坐标
# monitor = DVI-D-1, preferred, 0x0, 1, transform, 1   # 竖屏示例
#
# headless（如 Sunshine 虚拟屏）：若出现异常，可单独指定或 disable
# monitor = headless, 1920x1080@60, auto, 1
# ------------------------------------------------------------
