# ============================================================
# 环境变量与启动命令（exec-once）
# 说明：稍后通过问答确认最小启动集合。
# DPI 见 env.conf（各环境 scale 不同）。
# ============================================================

# --- 环境变量：输入法（fcitx5）---
# 让 GTK / Qt / X11 / SDL 程序走 fcitx，换配置后中文输入更稳
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# --- 开机自启 ---
# 将会话变量导入 dbus / systemd（门户、托盘等依赖）
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 输入法（中文）
exec-once = fcitx5

# hyprbars：先加载 .so，再 reload 配置（否则 hyprbars:* 窗口规则无法注册）
exec-once = hyprpm reload -n && hyprctl reload

# Polkit 认证代理（提权密码框；包：hyprpolkitagent）
# 已卸载旧的 polkit-kde-agent，避免多代理抢会话
exec-once = systemctl --user start hyprpolkitagent

# xdg-desktop-portal：须在 waybar 之前；勿 killall 抢总线（会导致 gtk portal 超时、waybar 假死）
exec-once = systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal-gtk xdg-desktop-portal
exec-once = waybar

# --- 其余自启（待问答）---
# E6 nm-applet：延后（以后与 waybar 一并考虑）
# exec-once = nm-applet --indicator

# 剪贴板历史（Super+V / cliphist）
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# E8 foot --server：延后细化
# 以后可启用服务端，并将 Super+Return 改为 footclient：
# exec-once = foot --server

# E9 壁纸：awww 守护进程 + 恢复上次壁纸（无记录则随机）
exec-once = awww-daemon
exec-once = $scriptsDir/wallpaper.sh restore

# E10 光标 / 图标：延后细化（GTK、Qt 的 cursor 与 icon theme）
# 现网曾用：
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme "McMojava Cursors"

# E11 kwalletd6：不要（已不用 KDE 钱包）

# E12 Qt 平台主题：延后，与 E10 一并做 GTK/Qt 外观时再加
# env = QT_QPA_PLATFORMTHEME,qt5ct
