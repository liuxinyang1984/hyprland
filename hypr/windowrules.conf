# ============================================================
# 窗口规则
# 文档：https://wiki.hyprland.org/Configuring/Window-Rules/
# ============================================================

# 微信主窗（special 浮动）：减弱 activate 抢顶，减轻挡住弹出框
windowrule {
  name = wechat-main
  match:class = ^([Ww]echat)$
  match:title = ^(Weixin)$
  suppress_event = activate activatefocus
}

# 文件/保存对话框：扣除 reserved 区域居中，固定尺寸
windowrule {
  name = portal-file-dialog
  match:class = ^([Xx]dg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$
  float = on
  size = 800 480
  center = 1
}

windowrule {
  name = chromium-file-dialog
  match:class = ^([Mm]icrosoft-edge|[Gg]oogle-chrome)$
  match:title = ^([Oo]pen|[Ss]ave|[Cc]hoose|[Ss]elect).*
  float = on
  size = 800 480
  center = 1
}

# 微信 Open/Save：与 Edge/portal 同尺寸；stay_focused 减轻被主窗盖住
windowrule {
  name = wechat-file-dialog
  match:class = ^([Ww]echat)$
  match:title = ^([Oo]pen|[Ss]ave|[Cc]hoose|[Ss]elect).*
  float = on
  size = 800 480
  center = 1
  stay_focused = on
  focus_on_activate = on
}
