# ============================================================
# 窗口规则
# 文档：https://wiki.hyprland.org/Configuring/Window-Rules/
# ============================================================

# Chromium/Edge（原生 Wayland）悬停 tooltip：错误做成空 class+title 的短命
# xdg_toplevel，会抢焦点并参与 tiling（闪一下消失；最大化被打回平铺）。
# 社区绕过：https://github.com/hyprwm/Hyprland/discussions/14265
windowrule {
  name = empty-transient-tooltip
  match:class = ^()$
  match:title = ^()$
  float = on
  no_initial_focus = on
  border_size = 0
  rounding = 0
  hyprbars:no_bar = true
  move = cursor_x+8 cursor_y+20
}

# fcitx5 候选窗（XWayland）：special 工作区易被 Electron/微信盖住（能出字看不见框）
# Hyprland #2439；pin + pseudo 稳定叠层
windowrule {
  name = fcitx-input-window
  match:title = ^(Fcitx5 Input Window)$
  float = on
  pin = on
  pseudo = on
  no_focus = on
  opaque = on
  opacity = 1 override 1 override 1 override
  border_size = 0
  no_shadow = on
  no_blur = on
}

# 微信主窗：减弱 activate 抢顶，减轻挡住弹出框；保持平铺（不进下方 non-main float）
windowrule {
  name = wechat-main
  match:class = ^([Ww]echat)$
  match:title = ^(Weixin)$
  suppress_event = activate activatefocus
}

# 微信非主窗一律浮动（菜单/表情保持应用给的位置，不 center）
windowrule {
  name = wechat-non-main-float
  match:class = ^([Ww]echat)$
  match:title = negative:^(Weixin)$
  float = on
}

# 大块次级窗再居中（title=wechat 的菜单/表情不会命中）
windowrule {
  name = wechat-secondary-center
  match:class = ^([Ww]echat)$
  match:title = ^(Chat History|Photos and Videos|Moments|Settings).*
  center = 1
}

# 微信右键/下拉：title 小写 wechat
# border_size=0 / no_blur / no_shadow：不渲染装饰，避免衬出窗体透明外圈
windowrule {
  name = wechat-transient-popup
  match:class = ^([Ww]echat)$
  match:title = ^(wechat)$
  focus_on_activate = on
  border_size = 0
  no_blur = on
  no_shadow = on
}

# 微信小程序：class 为空、title=WeChat（不进 class=wechat 那条）
windowrule {
  name = wechat-miniprogram-float
  match:class = ^()$
  match:title = ^(WeChat)$
  float = on
  center = 1
}

# 文件/保存对话框：扣除 reserved 区域居中，固定尺寸
windowrule {
  name = portal-file-dialog
  match:class = ^([Xx]dg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$
  float = on
  size = 800 480
  center = 1
}

windowrule {
  name = chromium-file-dialog
  match:class = ^([Mm]icrosoft-edge|[Gg]oogle-chrome)$
  match:title = ^([Oo]pen|[Ss]ave|[Cc]hoose|[Ss]elect).*
  float = on
  size = 800 480
  center = 1
}

# 微信 Open/Save：与 Edge/portal 同尺寸；stay_focused 减轻被主窗盖住
windowrule {
  name = wechat-file-dialog
  match:class = ^([Ww]echat)$
  match:title = ^([Oo]pen|[Ss]ave|[Cc]hoose|[Ss]elect).*
  float = on
  size = 800 480
  center = 1
  stay_focused = on
  focus_on_activate = on
}
