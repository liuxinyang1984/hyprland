# ============================================================
# 环境 overlay — DP-1 主屏 + DP-2 在左（scale 1.25）
# ============================================================

exec-once = echo "Xft.dpi: 120" | xrdb -merge

# 左屏必须从 0x0 起排（勿用负坐标）：否则 XWayland/xrandr 会重排屏幕，
# 导致 fcitx 在一侧显示器失效。
# DP-2 scale 1 → 逻辑宽 1600；DP-1 scale 1.25 接在右侧。
monitor = DP-2, preferred, 0x0, 1
monitor = DP-1, preferred, 1600x0, 1.25
monitor = , preferred, auto, 1.25

# 主屏 1–5，左屏 6–10
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2
