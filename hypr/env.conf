# ============================================================
# 环境 overlay — 办公室台式机（DP-1 + DVI-D-1 竖屏）
# ============================================================

# --- DPI（scale 1.0 → 96，系统默认）---
exec-once = echo "Xft.dpi: 96" | xrdb -merge

# --- 本机显示器（缩放 1.0）---
monitor = DP-1, 1920x1200, 0x0, 1
monitor = DVI-D-1, 1600x1200, 1940x0, 1, transform, 1
# 竖屏顶部分割：预留 300px（平铺窗口从下方开始；与 topterm 高度独立）
monitor = DVI-D-1, addreserved, 300, 0, 0, 0
monitor = , preferred, auto, 1

# --- 工作区：主屏 1–5，副屏 6–10（Super+0 → 10）---
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DVI-D-1
workspace = 7, monitor:DVI-D-1
workspace = 8, monitor:DVI-D-1
workspace = 9, monitor:DVI-D-1
workspace = 10, monitor:DVI-D-1

# --- special 工作区 left / right（Super+[ / Super+]；Waybar show-special=false 不显示）---
workspace = special:left, monitor:DP-1
workspace = special:right, monitor:DVI-D-1

bind = $mainMod, bracketleft, exec, $scriptsDir/toggle-special.sh DP-1 left
bind = $mainMod SHIFT, bracketleft, movetoworkspacesilent, special:left
bind = $mainMod CTRL, bracketleft, movetoworkspace, special:left

bind = $mainMod, bracketright, exec, $scriptsDir/toggle-special.sh DVI-D-1 right
bind = $mainMod SHIFT, bracketright, movetoworkspacesilent, special:right
bind = $mainMod CTRL, bracketright, movetoworkspace, special:right

# backspace 仅右屏（覆盖 keybinds.conf 里跟焦点屏走的 togglespecialworkspace）
workspace = special:backspace, monitor:DVI-D-1
unbind = $mainMod, BackSpace
bind = $mainMod, BackSpace, exec, $scriptsDir/toggle-special.sh DVI-D-1 backspace

# 竖屏顶部分割区：pin 浮动终端（始终可见；grave 聚焦）
windowrule {
  name = topterm-foot
  match:class = ^(topterm)$

  monitor = DVI-D-1
  pin = on
  float = on
  size = (monitor_w - 10) 288
  move = 5 5
  rounding = 0
  no_initial_focus = on
  opacity = 1 override 1 override 1 override
  animation = slide top
}

bind = $mainMod, grave, exec, $scriptsDir/topterm.sh --focus
bind = $mainMod SHIFT, grave, exec, $scriptsDir/topterm.sh --focus

exec-once = $scriptsDir/topterm.sh

# topterm 打开：slide top 幕布降落 + Q 弹贝塞尔（仅 windowsIn）
animations {
    bezier = curtainBounce, 0.28, 1.65, 0.88, 1.0
    animation = windows, 0, 1, default
    animation = windowsIn, 1, 5, curtainBounce
    animation = fade, 0, 1, default
    animation = fadeIn, 0, 1, default
    animation = fadeSwitch, 0, 1, default
    animation = windowsMove, 0, 1, default
}

# --- special 缩放：覆盖公共 dwindle.special_scale_factor（所有 special 共用）---
dwindle {
  special_scale_factor = 0.9
}

# --- 微信进 special:backspace；主窗 Weixin 仍平铺（float 在公共 windowrules）---
windowrule {
  name = wechat-to-backspace
  match:class = ^([Ww]echat)$
  match:title = ^(Weixin)$
  workspace = special:backspace
}

windowrule {
  name = wechat-miniprogram-to-backspace
  match:class = ^()$
  match:title = ^(WeChat)$
  workspace = special:backspace
}

# Xephyr → Super+\ 的 special:backslash，启动即最大化
windowrule {
  name = xephyr-to-backslash-maximize
  match:class = ^(Xephyr)$
  workspace = special:backslash
  maximize = on
}
