# ============================================================
# 环境 overlay — ThinkPad X1C（eDP-1 + headless）
# ============================================================

# --- DPI（scale 1.25 → 120）---
exec-once = echo "Xft.dpi: 120" | xrdb -merge

# --- 本机显示器 ---
monitor = eDP-1, preferred, 0x0, 1.25
monitor = headless, 1920x1080@120, auto, 2
monitor = , preferred, auto, 1.25

# --- 工作区：主屏 1–5，headless 6–10（Super+0 → 10）---
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:headless
workspace = 7, monitor:headless
workspace = 8, monitor:headless
workspace = 9, monitor:headless
workspace = 10, monitor:headless

# --- 蓝色主题（覆盖 title 默认绿色）---
general {
    col.active_border = rgb(0099ff)
}

plugin {
    hyprbars {
        bar_color = rgb(0099ff)
    }
}
