# ============================================================
# 快捷键绑定
# 说明：本文件通过问答逐项建立；未确认的绑定请勿擅自添加。
# 文档：https://wiki.hyprland.org/Configuring/Binds/
# ============================================================

# 主修饰键：SUPER（Win 键）
$mainMod = SUPER

# ------------------------------------------------------------
# 1. 窗口与会话
# ------------------------------------------------------------

# 打开终端（foot）
bind = $mainMod, Return, exec, foot

# 关闭当前窗口
bind = $mainMod, Q, killactive,

# 强制杀窗（进入点选杀窗模式）
bind = $mainMod SHIFT, Q, exec, hyprctl kill

# 退出 Hyprland
bind = $mainMod SHIFT, E, exit,

# 切换浮动 / 平铺
bind = $mainMod, T, togglefloating,

# 伪全屏（最大化类，保留间隙/栏等行为依版本而定）
bind = $mainMod, M, fullscreen, 1

# 真全屏
bind = $mainMod SHIFT, M, fullscreen, 2

# 重载 Hyprland 配置
bind = $mainMod CTRL SHIFT, R, exec, hyprctl reload

# ------------------------------------------------------------
# 2. 焦点与移动
# ------------------------------------------------------------

# 移动焦点（HJKL）
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# 移动窗口（HJKL）
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# 调整窗口大小（按住重复）
binde = $mainMod CTRL, H, resizeactive, -50 0
binde = $mainMod CTRL, L, resizeactive, 50 0
binde = $mainMod CTRL, K, resizeactive, 0 -50
binde = $mainMod CTRL, J, resizeactive, 0 50

# 鼠标：Super + 左键拖移 / 右键缩放
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ------------------------------------------------------------
# 3. 工作区
# ------------------------------------------------------------

# 切换到工作区 1–10（0 表示 10）
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 将窗口带到目标工作区并跟随切换
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# 将窗口静默移到目标工作区（不跟随）
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# 相对切换：下一个 / 上一个已有工作区
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# 多显示器：在显示器之间切换工作区
bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

# --- 具名特殊工作区：BackSpace ---
# Super：切换显示；Shift：静默移入；Ctrl：移入并跟随
bind = $mainMod, BackSpace, togglespecialworkspace, backspace
bind = $mainMod SHIFT, BackSpace, movetoworkspacesilent, special:backspace
bind = $mainMod CTRL, BackSpace, movetoworkspace, special:backspace

# --- 具名特殊工作区：backslash ---
bind = $mainMod, backslash, togglespecialworkspace, backslash
bind = $mainMod SHIFT, backslash, movetoworkspacesilent, special:backslash
bind = $mainMod CTRL, backslash, movetoworkspace, special:backslash

# ------------------------------------------------------------
# 4. 媒体与笔记本功能键
# 状态：延后（基础功能完成后再补充）
# 计划包含：音量、麦克风、亮度、键盘背光、触控板、
#           飞行模式、合盖、播放控制、锁屏等
# ------------------------------------------------------------

# ------------------------------------------------------------
# 5. 启动器 / 截图 / 剪贴板等
# ------------------------------------------------------------

# Wofi 应用启动器（再按一次关闭）
bind = $mainMod, Space, exec, ~/.config/wofi/launch.sh

# Wofi 运行命令
bind = $mainMod, R, exec, ~/.config/wofi/launch-run.sh

# 截图 / 剪贴板等：延后
