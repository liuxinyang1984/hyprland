# ============================================================
# hyprlock — 锁屏
# 文档：https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# 色系对齐 Waybar dark（#373737 + 蓝强调）
#
# 暂不依赖 env.conf；main 写死 eDP-1（家用笔记本）。
# 锁屏方案 / 多环境适配推后讨论。
# ============================================================

$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
  ignore_empty_input = true
  # 动画关闭：减少 session-lock 期间 GPU 负担
  # immediate_render = true
}

animations {
  enabled = false
}

background {
  monitor = eDP-1
  color = rgba(30, 30, 36, 1.0)
}

label {
  monitor = eDP-1
  text = $TIME
  color = rgba(255, 255, 255, 0.95)
  font_size = 96
  font_family = $font
  position = 0, 120
  halign = center
  valign = center
}

label {
  monitor = eDP-1
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = rgba(222, 222, 222, 0.85)
  font_size = 22
  font_family = $font
  position = 0, 40
  halign = center
  valign = center
}

input-field {
  monitor = eDP-1
  size = 320, 56
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  rounding = 12

  outer_color = rgba(116, 141, 234, 0.9)
  inner_color = rgba(55, 55, 55, 0.85)
  font_color = rgba(255, 255, 255, 0.95)
  check_color = rgba(49, 91, 239, 0.95)
  fail_color = rgba(243, 139, 168, 0.95)
  capslock_color = rgba(249, 226, 175, 0.95)

  fade_on_empty = false
  font_family = $font
  placeholder_text = <span foreground="##dedede">输入密码…</span>
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

  position = 0, -80
  halign = center
  valign = center
}
