# ============================================================
# Hyprland 主配置入口
# 文档：https://wiki.hyprland.org/
# ============================================================

# 仓库内 scripts/（与 waybar/wofi 并列；勿与旧的 ~/.config/scripts 混淆）
# 若移动本仓库路径，请同步修改此变量。
$scriptsDir = $HOME/git/hyprland/scripts

# --- 分文件（env 最后：本机 monitor / DPI 等覆盖；公共文件不依赖 env）---
source = ./workspaces.conf
source = ./keybinds.conf
source = ./exec.conf
source = ./windowrules.conf
source = ./env.conf

# ------------------------------------------------------------
# 常规：边框、间隙、布局
# ------------------------------------------------------------
general {
    border_size = 5
    gaps_in = 3
    gaps_out = 6
    # 活动边框：四色渐变
    col.active_border = rgb(0099ff)
    col.inactive_border = rgb(6c7086)
    resize_on_border = true
    layout = dwindle
}

# ------------------------------------------------------------
# 装饰：圆角、透明、模糊
# ------------------------------------------------------------
decoration {
    rounding = 5
    active_opacity = 0.9
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
    }

    dim_inactive = 0
    dim_strength = 0.3
}

# ------------------------------------------------------------
# 动画（简单默认曲线，不使用自定义 bezier）
# ------------------------------------------------------------
animations {
    enabled = true
    animation = windows, 1, 5, default
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# ------------------------------------------------------------
# 输入设备
# 约定：与 Hyprland 默认相同的项不写；仅保留有意偏离默认的设置。
# I1–I6、I9：默认不写；I7–I8：如下；I10 手势：延后细化
# ------------------------------------------------------------
input {
    # I4 float_switch_override_focus：现用默认 1（切换平铺/浮动时焦点跟随光标下窗口）
    # 原配置为 0（切换时不改焦点）；若手感不对可改回：
    # float_switch_override_focus = 0

    touchpad {
        # 1/2/3 指按下映射为左/右/中键（默认关；原配置为开）
        clickfinger_behavior = true
        # 关闭轻触点击，需按下触控板（默认开；原配置为关）
        tap-to-click = false
    }
}

# --- 手势（I10，延后）---
# 以后可最小启用三指切工作区，再对照现网调距离/反转等：
# gesture = 3, horizontal, workspace
# gestures {
#     workspace_swipe_distance = 400
#     workspace_swipe_invert = true
#     workspace_swipe_forever = true
#     ...
# }

# ------------------------------------------------------------
# 杂项 misc / dwindle / master / binds
# 约定：默认不写；仅保留有意偏离默认的项。
# ------------------------------------------------------------
misc {
  # 锁屏进程异常退出后可恢复（否则可能卡在无法解锁的 session-lock）
  allow_session_lock_restore = true
}

# dwindle：上下/左右由 WM 按容器比例决定；新窗口在右/下；分叉跟随焦点窗口
dwindle {
  force_split = 2
  preserve_split = false
  use_active_for_splits = true
  special_scale_factor = 0.8
}
